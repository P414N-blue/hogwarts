<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>호그와트 페어틀 메이커</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* 기숙사별 스트라이프 패턴 (html2canvas 호환용 SVG 패턴 적용) */
    [data-house="default"] {
      background-color: var(--bg-default);
      color: var(--text-default);
    }
    [data-house="default"] .tie-element {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30'><rect width='30' height='30' fill='%233a414d'/><path d='M-5,5 L5,-5 M0,30 L30,0 M25,35 L35,25' stroke='%238a96a8' stroke-width='8'/></svg>");
      background-repeat: repeat;
    }
    [data-house="default"] .profile-box { border-color: var(--border-default); }

    [data-house="gryffindor"] {
      background-color: var(--bg-gryffindor);
      color: var(--text-gryffindor);
    }
    [data-house="gryffindor"] .tie-element {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='33' height='33'><rect width='33' height='33' fill='%23740001'/><path d='M-5,5 L5,-5 M0,33 L33,0 M28,38 L38,28' stroke='%23d3a625' stroke-width='8'/></svg>");
      background-repeat: repeat;
    }
    [data-house="gryffindor"] .profile-box { border-color: var(--border-gryffindor); }

    [data-house="slytherin"] {
      background-color: var(--bg-slytherin);
      color: var(--text-slytherin);
    }
    [data-house="slytherin"] .tie-element {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='33' height='33'><rect width='33' height='33' fill='%231a472a'/><path d='M-5,5 L5,-5 M0,33 L33,0 M28,38 L38,28' stroke='%238d99ae' stroke-width='8'/></svg>");
      background-repeat: repeat;
    }
    [data-house="slytherin"] .profile-box { border-color: var(--border-slytherin); }

    [data-house="ravenclaw"] {
      background-color: var(--bg-ravenclaw);
      color: var(--text-ravenclaw);
    }
    [data-house="ravenclaw"] .tie-element {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='33' height='33'><rect width='33' height='33' fill='%230e1a40'/><path d='M-5,5 L5,-5 M0,33 L33,0 M28,38 L38,28' stroke='%23cacaca' stroke-width='8'/></svg>");
      background-repeat: repeat;
    }
    [data-house="ravenclaw"] .profile-box { border-color: var(--border-ravenclaw); }

    [data-house="hufflepuff"] {
      background-color: var(--bg-hufflepuff);
      color: var(--text-hufflepuff);
    }
    [data-house="hufflepuff"] .tie-element {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='33' height='33'><rect width='33' height='33' fill='%23ecb939'/><path d='M-5,5 L5,-5 M0,33 L33,0 M28,38 L38,28' stroke='%23372e29' stroke-width='8'/></svg>");
      background-repeat: repeat;
    }
    [data-house="hufflepuff"] .profile-box { border-color: var(--border-hufflepuff); }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
    }

    body {
      background-color: #dbe2ef;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      gap: 20px;
    }

    /* 컨트롤 패널 */
    .control-panel {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .panel-section {
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
    }

    .panel-title {
      font-size: 14px;
      font-weight: bold;
      color: #4a5568;
      margin-bottom: 8px;
    }

    .house-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 6px 12px;
      border: 1px solid #cbd5e0;
      background: #f7fafc;
      border-radius: 16px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #2b6cb0;
      color: white;
      border-color: #2b6cb0;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .input-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
    }

    .input-box input[type="text"], .input-box input[type="file"] {
      padding: 6px 10px;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
    }

    .save-btn {
      padding: 12px;
      background: #2b6cb0;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    .save-btn:hover { background: #2c5282; }

    /* 카드 메인 프레임 */
    .pair-card {
      width: 500px;
      height: 700px;
      background-color: #fcfcfc;
      border: 1px solid #cbd5e0;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    /* 상/하단 기숙사별 독립 영역 */
    .half-section {
      position: relative;
      width: 100%;
      height: 50%;
      padding: 35px 40px;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s;
    }

    .half-section.top-half {
      justify-content: flex-start;
      align-items: flex-end;
    }

    .half-section.bottom-half {
      justify-content: flex-end;
      align-items: flex-start;
    }

    /* 모서리 대각선 띠 스타일 */
    .tie-element {
      position: absolute;
      width: 400px;
      height: 85px;
      pointer-events: none;
      z-index: 2;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: background 0.3s;
    }

    .tie-element::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.25) 100%);
    }

    .tie-top-left {
      top: 40px;
      left: -130px;
      transform: rotate(-45deg);
      transform-origin: center;
    }

    .tie-bottom-right {
      bottom: 40px;
      right: -130px;
      transform: rotate(-45deg);
      transform-origin: center;
    }

    /* 기숙사별 스트라이프 패턴 */
    [data-house="default"] {
      background-color: var(--bg-default);
      color: var(--text-default);
    }
    [data-house="default"] .tie-element {
      background: repeating-linear-gradient(-45deg, var(--tie-default-1), var(--tie-default-1) 22px, var(--tie-default-2) 22px, var(--tie-default-2) 30px);
    }
    [data-house="default"] .profile-box { border-color: var(--border-default); }

    [data-house="gryffindor"] {
      background-color: var(--bg-gryffindor);
      color: var(--text-gryffindor);
    }
    [data-house="gryffindor"] .tie-element {
      background: repeating-linear-gradient(-45deg, var(--tie-gryffindor-1), var(--tie-gryffindor-1) 25px, var(--tie-gryffindor-2) 25px, var(--tie-gryffindor-2) 33px);
    }
    [data-house="gryffindor"] .profile-box { border-color: var(--border-gryffindor); }

    [data-house="slytherin"] {
      background-color: var(--bg-slytherin);
      color: var(--text-slytherin);
    }
    [data-house="slytherin"] .tie-element {
      background: repeating-linear-gradient(-45deg, var(--tie-slytherin-1), var(--tie-slytherin-1) 25px, var(--tie-slytherin-2) 25px, var(--tie-slytherin-2) 33px);
    }
    [data-house="slytherin"] .profile-box { border-color: var(--border-slytherin); }

    [data-house="ravenclaw"] {
      background-color: var(--bg-ravenclaw);
      color: var(--text-ravenclaw);
    }
    [data-house="ravenclaw"] .tie-element {
      background: repeating-linear-gradient(-45deg, var(--tie-ravenclaw-1), var(--tie-ravenclaw-1) 25px, var(--tie-ravenclaw-2) 25px, var(--tie-ravenclaw-2) 33px);
    }
    [data-house="ravenclaw"] .profile-box { border-color: var(--border-ravenclaw); }

    [data-house="hufflepuff"] {
      background-color: var(--bg-hufflepuff);
      color: var(--text-hufflepuff);
    }
    [data-house="hufflepuff"] .tie-element {
      background: repeating-linear-gradient(-45deg, var(--tie-hufflepuff-1), var(--tie-hufflepuff-1) 25px, var(--tie-hufflepuff-2) 25px, var(--tie-hufflepuff-2) 33px);
    }
    [data-house="hufflepuff"] .profile-box { border-color: var(--border-hufflepuff); }

    /* 중앙 구분선 */
    .middle-divider {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 6px;
      background: #4a5568;
      z-index: 5;
      transform: translateY(-50%);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* 프로필 프레임 설정 */
    .profile-box {
      width: 150px;
      height: 150px;
      border: 4px solid #2d3748;
      background-color: #edf2f7;
      position: relative;
      overflow: hidden;
      z-index: 3;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      cursor: grab;
      user-select: none;
    }

    .profile-box:active {
      cursor: grabbing;
    }

    .profile-box img {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: center center;
      pointer-events: none;
    }

    /* 이름 및 부가설명 텍스트 */
    .name-box {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      z-index: 3;
      gap: 2px;
    }

    .top-half .name-box { text-align: right; }
    .bottom-half .name-box { text-align: left; margin-bottom: 8px; margin-top: 0; }

    .desc-text {
      font-size: 11px;
      font-weight: 500;
      opacity: 0.75;
      letter-spacing: -0.2px;
      line-height: 1.2;
    }

    .kr-name { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
    .en-name { font-size: 13px; font-weight: 600; opacity: 0.85; text-transform: uppercase; }

    /* 자유 배치 스티커 레이어 */
    #sticker-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    .sticker-wrapper {
      position: absolute;
      display: inline-block;
      pointer-events: auto;
      cursor: move;
      user-select: none;
      border: 1px dashed transparent;
      transform-origin: center center;
    }

    .sticker-wrapper:hover {
      border-color: #3182ce;
    }

    .sticker-img {
      display: block;
      width: 100px;
      height: auto;
      pointer-events: none;
    }

    /* 삭제 버튼 */
    .sticker-wrapper .del-btn {
      position: absolute;
      top: -10px;
      right: -10px;
      background: #e53e3e;
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 12px;
      cursor: pointer;
      display: none;
      z-index: 12;
    }

    /* 크기 조절 핸들 (우측 하단) */
    .sticker-wrapper .resize-handle {
      position: absolute;
      bottom: -6px;
      right: -6px;
      width: 12px;
      height: 12px;
      background: #3182ce;
      border-radius: 2px;
      cursor: se-resize;
      display: none;
      z-index: 12;
    }

    /* 회전 핸들 (상단 중앙) */
    .sticker-wrapper .rotate-handle {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 12px;
      background: #38a169;
      border-radius: 50%;
      cursor: grab;
      display: none;
      z-index: 12;
    }

    .sticker-wrapper:hover .del-btn,
    .sticker-wrapper:hover .resize-handle,
    .sticker-wrapper:hover .rotate-handle {
      display: block;
    }
  </style>
</head>
<body>

  <div class="control-panel">
    
    <div class="panel-section">
      <div class="panel-title">1. 상단 기숙사 선택</div>
      <div class="house-tabs" id="top-tabs">
        <button class="tab-btn active" onclick="setHouse('top', 'default', this)">배정 전</button>
        <button class="tab-btn" onclick="setHouse('top', 'gryffindor', this)">그리핀도르</button>
        <button class="tab-btn" onclick="setHouse('top', 'slytherin', this)">슬리데린</button>
        <button class="tab-btn" onclick="setHouse('top', 'ravenclaw', this)">래번클로</button>
        <button class="tab-btn" onclick="setHouse('top', 'hufflepuff', this)">후플푸프</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-title">2. 하단 기숙사 선택</div>
      <div class="house-tabs" id="bottom-tabs">
        <button class="tab-btn active" onclick="setHouse('bottom', 'default', this)">배정 전</button>
        <button class="tab-btn" onclick="setHouse('bottom', 'gryffindor', this)">그리핀도르</button>
        <button class="tab-btn" onclick="setHouse('bottom', 'slytherin', this)">슬리데린</button>
        <button class="tab-btn" onclick="setHouse('bottom', 'ravenclaw', this)">래번클로</button>
        <button class="tab-btn" onclick="setHouse('bottom', 'hufflepuff', this)">후플푸프</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-title">3. 프로필 정보 입력</div>
      <div class="input-grid">
        <div class="input-box">
          <strong>상단 캐릭터 (우측)</strong>
          <input type="file" accept="image/*" onchange="loadProfileImg(event, 'img1')">
          <input type="text" placeholder="한글 이름" oninput="updateText('kr1', this.value)">
          <input type="text" placeholder="영어 이름" oninput="updateText('en1', this.value)">
          <input type="text" placeholder="부가설명" oninput="updateText('desc1', this.value)">
        </div>
        <div class="input-box">
          <strong>하단 캐릭터 (좌측)</strong>
          <input type="file" accept="image/*" onchange="loadProfileImg(event, 'img2')">
          <input type="text" placeholder="부가설명" oninput="updateText('desc2', this.value)">
          <input type="text" placeholder="영어 이름" oninput="updateText('en2', this.value)">
          <input type="text" placeholder="한글 이름" oninput="updateText('kr2', this.value)">
        </div>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-title">4. 스티커 추가 (여백 배치)</div>
      <input type="file" accept="image/*" multiple onchange="addSticker(event)">
      <span style="font-size: 11px; color: #718096; display: block; margin-top: 4px;">* 스티커: 드래그 이동 / 우측 하단 크기 조절 / 상단 초록 점 회전</span>
    </div>

    <button class="save-btn" onclick="downloadTemplate()">완성된 페어틀 저장하기</button>
  </div>

  <div class="pair-card" id="pairCard">
    
    <div id="sticker-container"></div>

    <div class="middle-divider"></div>

    <div class="half-section top-half" id="top-section" data-house="default">
      <div class="tie-element tie-top-left"></div>
      <div class="profile-box" id="box1">
        <img id="img1" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150' viewBox='0 0 24 24' fill='none' stroke='%23cbd5e0' stroke-width='1.5'><rect x='3' y='3' width='18' height='18' rx='2'/><circle cx='8.5' cy='8.5' r='1.5'/><path d='M21 15l-5-5L5 21'/></svg>">
      </div>
      <div class="name-box">
        <span class="kr-name" id="txt-kr1">한글 이름</span>
        <span class="en-name" id="txt-en1">ENGLISH NAME</span>
        <span class="desc-text" id="txt-desc1">부가 설명</span>
      </div>
    </div>

    <div class="half-section bottom-half" id="bottom-section" data-house="default">
      <div class="tie-element tie-bottom-right"></div>
      <div class="name-box">
        <span class="desc-text" id="txt-desc2">부가 설명</span>
        <span class="en-name" id="txt-en2">ENGLISH NAME</span>
        <span class="kr-name" id="txt-kr2">한글 이름</span>
      </div>
      <div class="profile-box" id="box2">
        <img id="img2" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150' viewBox='0 0 24 24' fill='none' stroke='%23cbd5e0' stroke-width='1.5'><rect x='3' y='3' width='18' height='18' rx='2'/><circle cx='8.5' cy='8.5' r='1.5'/><path d='M21 15l-5-5L5 21'/></svg>">
      </div>
    </div>

  </div>

  <script>
    // 프로필 이미지 조작 상태 저장 객체
    const profileStates = {
      img1: { x: 0, y: 0, scale: 1 },
      img2: { x: 0, y: 0, scale: 1 }
    };

    function updateTransform(imgId) {
      const state = profileStates[imgId];
      const img = document.getElementById(imgId);
      img.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
    }

    function setHouse(position, houseName, btn) {
      const section = document.getElementById(position + '-section');
      section.setAttribute('data-house', houseName);

      const tabContainer = document.getElementById(position + '-tabs');
      const buttons = tabContainer.querySelectorAll('.tab-btn');
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function updateText(id, val) {
      const target = document.getElementById('txt-' + id);
      if (id.startsWith('desc')) {
        target.innerText = val || '';
      } else if (id.startsWith('kr')) {
        target.innerText = val || '한글 이름';
      } else {
        target.innerText = val ? val.toUpperCase() : 'ENGLISH NAME';
      }
    }

    function loadProfileImg(event, targetId) {
      const reader = new FileReader();
      const img = document.getElementById(targetId);
      
      reader.onload = function() {
        img.src = reader.result;
        img.onload = function() {
          const boxSize = 150;
          const scale = Math.max(boxSize / img.naturalWidth, boxSize / img.naturalHeight);
          profileStates[targetId] = {
            x: (boxSize - img.naturalWidth) / 2,
            y: (boxSize - img.naturalHeight) / 2,
            scale: scale
          };
          img.style.width = img.naturalWidth + 'px';
          img.style.height = img.naturalHeight + 'px';
          updateTransform(targetId);
        }
      };

      if (event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
      }
    }

    function initProfileInteractions(boxId, imgId) {
      const box = document.getElementById(boxId);
      let isDragging = false;
      let startX, startY;

      box.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX - profileStates[imgId].x;
        startY = e.clientY - profileStates[imgId].y;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        profileStates[imgId].x = e.clientX - startX;
        profileStates[imgId].y = e.clientY - startY;
        updateTransform(imgId);
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });

      box.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSpeed = 0.08;
        if (e.deltaY < 0) {
          profileStates[imgId].scale *= (1 + zoomSpeed);
        } else {
          profileStates[imgId].scale /= (1 + zoomSpeed);
          if (profileStates[imgId].scale < 0.1) profileStates[imgId].scale = 0.1;
        }
        updateTransform(imgId);
      }, { passive: false });
    }

    initProfileInteractions('box1', 'img1');
    initProfileInteractions('box2', 'img2');

    function addSticker(event) {
      const files = event.target.files;
      const container = document.getElementById('sticker-container');

      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const wrapper = document.createElement('div');
          wrapper.className = 'sticker-wrapper';
          wrapper.style.left = '180px';
          wrapper.style.top = '270px';

          const img = document.createElement('img');
          img.src = e.target.result;
          img.className = 'sticker-img';

          const delBtn = document.createElement('button');
          delBtn.className = 'del-btn';
          delBtn.innerText = '×';
          delBtn.onclick = () => wrapper.remove();

          const resizeHandle = document.createElement('div');
          resizeHandle.className = 'resize-handle';

          const rotateHandle = document.createElement('div');
          rotateHandle.className = 'rotate-handle';

          wrapper.appendChild(img);
          wrapper.appendChild(delBtn);
          wrapper.appendChild(resizeHandle);
          wrapper.appendChild(rotateHandle);
          container.appendChild(wrapper);

          makeStickerInteractive(wrapper, img, resizeHandle, rotateHandle);
        };
        reader.readAsDataURL(file);
      });
    }

    function makeStickerInteractive(wrapper, img, resizeHandle, rotateHandle) {
      let isDragging = false;
      let isResizing = false;
      let isRotating = false;
      let startX, startY, startLeft, startTop, startWidth;
      let currentRotation = 0;

      // 드래그 (이동)
      wrapper.addEventListener('mousedown', (e) => {
        if (e.target === resizeHandle || e.target === rotateHandle || e.target.classList.contains('del-btn')) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startLeft = wrapper.offsetLeft;
        startTop = wrapper.offsetTop;
        e.preventDefault();
      });

      // 리사이즈 (크기 조절)
      resizeHandle.addEventListener('mousedown', (e) => {
        isResizing = true;
        startX = e.clientX;
        startWidth = img.offsetWidth;
        e.stopPropagation();
        e.preventDefault();
      });

      // 회전 (기울이기)
      rotateHandle.addEventListener('mousedown', (e) => {
        isRotating = true;
        e.stopPropagation();
        e.preventDefault();
      });

      window.addEventListener('mousemove', (e) => {
        if (isDragging) {
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          wrapper.style.left = `${startLeft + dx}px`;
          wrapper.style.top = `${startTop + dy}px`;
        } else if (isResizing) {
          const dx = e.clientX - startX;
          const newWidth = Math.max(30, startWidth + dx);
          img.style.width = `${newWidth}px`;
        } else if (isRotating) {
          const rect = wrapper.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const radians = Math.atan2(e.clientX - centerX, -(e.clientY - centerY));
          currentRotation = radians * (180 / Math.PI);
          wrapper.style.transform = `rotate(${currentRotation}deg)`;
        }
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
        isResizing = false;
        isRotating = false;
      });
    }

    function downloadTemplate() {
      const card = document.getElementById('pairCard');
      html2canvas(card, { 
        scale: 2,
        useCORS: true 
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'hogwarts.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
